name: Build AsieATable APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "android-project.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -q android-project.zip -d project
          test -f project/settings.gradle
          test -f project/app/build.gradle

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AsieATable-V4-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
